<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23221a"/>
      <stop offset="1" stop-color="#0b0b08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffe14a" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#ffd000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffd000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="y" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset=".5" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#f5a800"/>
    </linearGradient>
    <radialGradient id="pk" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff9c4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd60a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#ffd60a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe45c" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- faint grid / route map -->
  <g stroke="#ffd60a" stroke-opacity=".07" stroke-width="2">
    <line x1="16" y1="176" x2="496" y2="176"/><line x1="16" y1="336" x2="496" y2="336"/>
    <line x1="176" y1="16" x2="176" y2="496"/><line x1="336" y1="16" x2="336" y2="496"/>
  </g>

  <!-- speed streaks -->
  <rect x="62" y="204" width="98" height="18" rx="9" fill="url(#streak)"/>
  <rect x="88" y="252" width="72" height="18" rx="9" fill="url(#streak)"/>
  <rect x="110" y="300" width="50" height="18" rx="9" fill="url(#streak)"/>

  <!-- the route: a bold P -->
  <path d="M190 404 V168 Q190 132 226 132 H292 A86 86 0 0 1 292 304 H236"
        fill="none" stroke="url(#y)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dashed trail inside the stroke = packets in flight -->
  <path d="M190 380 V168 Q190 132 226 132 H292 A86 86 0 0 1 292 304"
        fill="none" stroke="#1a1605" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22"/>

  <!-- origin node -->
  <circle cx="190" cy="404" r="14" fill="#1a1605"/>

  <!-- the packet (leaving the route, top-right) -->
  <circle cx="412" cy="112" r="80" fill="url(#pk)"/>
  <rect x="386" y="86" width="52" height="52" rx="11" transform="rotate(45 412 112)" fill="#ffffff"/>
  <rect x="398" y="98" width="28" height="28" rx="6" transform="rotate(45 412 112)" fill="#ffd60a"/>

  <!-- ping arcs -->
  <g fill="none" stroke="#ffd60a" stroke-linecap="round" stroke-width="12">
    <path d="M404 360 A56 56 0 0 1 404 440" stroke-opacity=".9" transform="translate(-4 0)"/>
    <path d="M430 340 A84 84 0 0 1 430 460" stroke-opacity=".45"/>
  </g>
</svg>
