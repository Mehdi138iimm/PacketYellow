# PacketYellow · Telegram Release Bot
#
# Automatically posts every published release to Telegram and keeps that post in
# sync (edit / delete).  Everything can also be triggered by hand from the
# "Run workflow" button, including a dry-run preview that sends nothing.
#
# Required repository secrets:
#   TG_TOKEN  – bot token from @BotFather
#   TG_CHAT   – destination chat, e.g. @PacketYellow or -1001234567890
# Optional:
#   TG_THREAD_ID – topic id when posting into a forum group
#
# The bot logic lives in .github/scripts/telegram_bot.py (stdlib only, tested in
# .github/workflows/telegram-bot-tests.yml).  See .github/telegram/README.md.

name: PacketYellow · Telegram Release Bot

on:
  release:
    types: [published, prereleased, released, edited, deleted]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = از رویداد فعلی | latest | tag | intro | doctor"
        type: choice
        options: [auto, latest, tag, intro, doctor]
        default: auto
        required: true
      tag:
        description: "برچسب نسخه برای mode=tag (مثلاً v1.7.0)"
        required: false
        default: ""
      force:
        description: "ارسال دوباره حتی اگر قبلاً ارسال شده باشد"
        type: boolean
        default: false
      dry_run:
        description: "فقط پیش‌نمایش؛ هیچ پیامی ارسال نمی‌شود"
        type: boolean
        default: false
      silent:
        description: "ارسال بدون نوتیفیکیشن صوتی"
        type: boolean
        default: false
      chat:
        description: "ارسال به مقصد دیگر (خالی = مقدار TG_CHAT)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: packetyellow-telegram
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  notify:
    name: Send release notification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'auto' }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          SILENT: ${{ inputs.silent }}
          CHAT_OVERRIDE: ${{ inputs.chat }}
        run: python .github/scripts/telegram_bot.py

      - name: Persist bot state
        # Runs even when the send step failed, so partially sent posts are still
        # remembered and never duplicated by a retry.
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/telegram-message-map.json .github/telegram-intro-state.json; then
            echo "No bot state change to persist."
            exit 0
          fi

          git add .github/telegram-message-map.json .github/telegram-intro-state.json
          git commit -m "chore(telegram): update bot state [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Bot state persisted."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying…"
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            sleep 5
          done

          echo "::warning::Could not push the bot state file. The Telegram post was already sent, but duplicate protection is stale. Check Settings → Actions → Workflow permissions (needs Read and write)."
