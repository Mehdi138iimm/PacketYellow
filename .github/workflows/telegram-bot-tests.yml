# PacketYellow · Telegram bot tests
#
# The bot scripts are plain Python with no dependencies, so their unit tests and
# the end-to-end tests (against an in-process fake Telegram/GitHub API) run in a
# few seconds.  No secrets are used here.

name: PacketYellow · Telegram Bot Tests

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/telegram*.yml"
      - ".github/telegram/**"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/telegram*.yml"
      - ".github/telegram/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packetyellow-telegram-tests
  cancel-in-progress: true

jobs:
  tests:
    name: Test bot scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile scripts
        run: |
          python -m py_compile \
            .github/scripts/tg_text.py \
            .github/scripts/telegram_bot.py \
            .github/scripts/tests/support.py \
            .github/scripts/tests/test_tg_text.py \
            .github/scripts/tests/test_telegram_bot.py

      - name: Run unit and end-to-end tests
        run: python -m unittest discover -s .github/scripts/tests -v
