# PacketYellow · Introduce Bot
#
# Posts the one-time introduction message.  The intro is recorded in
# .github/telegram-intro-state.json, so repeated runs do nothing unless
# "force" is checked.
#
# Required secrets: TG_TOKEN, TG_CHAT (see .github/telegram/README.md).

name: PacketYellow · Introduce Bot

on:
  workflow_dispatch:
    inputs:
      force:
        description: "ارسال دوبارهٔ پیام معرفی (حتی اگر قبلاً ارسال شده باشد)"
        type: boolean
        default: false
      dry_run:
        description: "فقط پیش‌نمایش؛ هیچ پیامی ارسال نمی‌شود"
        type: boolean
        default: false
      chat:
        description: "ارسال به مقصد دیگر (خالی = مقدار TG_CHAT)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: packetyellow-telegram
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  introduce:
    name: Send introduction message
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send introduction
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MODE: intro
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHAT_OVERRIDE: ${{ inputs.chat }}
        run: python .github/scripts/telegram_bot.py

      - name: Persist bot state
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/telegram-intro-state.json; then
            echo "No bot state change to persist."
            exit 0
          fi

          git add .github/telegram-intro-state.json
          git commit -m "chore(telegram): record introduction [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Bot state persisted."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying…"
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            sleep 5
          done

          echo "::warning::Could not push the intro state file."
