<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF44F"/>
      <stop offset="100%" style="stop-color:#FFED4E"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur in="SourceGraphic" stdDeviation="3" /></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/></filter>
  </defs>
  
  <!-- background -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  
  <!-- glow effect -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.2" filter="url(#blur)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.1" filter="url(#blur)"/>
  
  <!-- main rounded square -->
  <rect x="96" y="96" width="320" height="320" rx="60" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- inner pattern: network nodes -->
  <g stroke="#D4A600" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4">
    <circle cx="180" cy="180" r="20"/>
    <circle cx="332" cy="180" r="20"/>
    <circle cx="256" cy="260" r="20"/>
    <line x1="200" y1="190" x2="312" y2="190"/>
    <line x1="200" y1="200" x2="256" y2="240"/>
    <line x1="312" y1="200" x2="256" y2="240"/>
  </g>
  
  <!-- central pulse point -->
  <circle cx="256" cy="260" r="28" fill="#D4A600" opacity="0.9" filter="url(#shadow)"/>
  <circle cx="256" cy="260" r="18" fill="#FFD700" opacity="0.7"/>
  <circle cx="256" cy="260" r="10" fill="white" opacity="0.8"/>
  
  <!-- speed lines (motion) -->
  <g stroke="#D4A600" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="120" y1="200" x2="90" y2="170"/>
    <line x1="120" y1="320" x2="90" y2="350"/>
    <line x1="392" y1="200" x2="422" y2="170"/>
    <line x1="392" y1="320" x2="422" y2="350"/>
    <line x1="160" y1="110" x2="140" y2="80"/>
    <line x1="352" y1="110" x2="372" y2="80"/>
  </g>
  
  <!-- corner accents -->
  <circle cx="130" cy="130" r="12" fill="#FFD700" opacity="0.6"/>
  <circle cx="382" cy="130" r="12" fill="#FFD700" opacity="0.6"/>
  <circle cx="130" cy="382" r="12" fill="#FFD700" opacity="0.6"/>
  <circle cx="382" cy="382" r="12" fill="#FFD700" opacity="0.6"/>
</svg>
