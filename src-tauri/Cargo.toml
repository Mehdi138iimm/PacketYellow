[package]
name = "packetyellow"
version = "0.5.1"
description = "PacketYellow: network toolkit"
authors = ["Mehdi"]
edition = "2021"

[lib]
name = "packetyellow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
hickory-resolver = "0.24"
if-addrs = "0.13"
bytes = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
